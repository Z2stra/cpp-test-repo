name: BlueBot v2.0.170 test dependencies

on:
  push:
    branches:
      - bluebot-v2.0.170-test-deps-20260818
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  prepare-node-modules:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use exact local Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Create isolated manifest matching BlueBot 2.0.170
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-env
          cat > test-env/package.json <<'JSON'
          {
            "name": "bluebot-v2.0.170-test-env",
            "private": true,
            "version": "2.0.170",
            "dependencies": {
              "@doctormckay/user-agents": "1.0.0",
              "better-sqlite3": "11.10.0",
              "colour": "0.7.0",
              "graceful-fs": "4.2.10",
              "mkdirp": "1.0.4",
              "node-telegram-bot-api": "0.29.0",
              "node-window-manager": "2.2.4",
              "object-sizeof": "1.6.3",
              "os-utils": "0.0.14",
              "p-queue": "6.6.2",
              "request": "2.88.2",
              "snoowrap": "1.14.1",
              "socks-proxy-agent": "5.0.1",
              "steam-totp": "2.1.2",
              "steam-tradeoffer-manager": "^2.0.0",
              "steam-user": "^4.0.0",
              "steamcommunity": "^3.0.0",
              "steamid": "1.1.3",
              "tgfancy": "0.13.0",
              "tunnel-agent": "0.6.0"
            }
          }
          JSON
          cd test-env
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install full manifest dependency tree and native bindings
        shell: bash
        run: |
          set -euo pipefail
          cd test-env
          npm ci --omit=dev --no-audit --no-fund

      - name: Verify native and runtime modules
        shell: bash
        run: |
          set -euo pipefail
          cd test-env
          node - <<'NODE'
          const Database = require('better-sqlite3');
          const db = new Database(':memory:');
          db.exec('CREATE TABLE t (id INTEGER PRIMARY KEY, value TEXT NOT NULL)');
          db.prepare('INSERT INTO t(value) VALUES (?)').run('ok');
          const row = db.prepare('SELECT value FROM t WHERE id = 1').get();
          if (!row || row.value !== 'ok') throw new Error('better-sqlite3 query verification failed');
          db.close();
          require('p-queue');
          require('steamcommunity');
          require('steamid');
          require('steam-user');
          require('steam-tradeoffer-manager');
          console.log('module-load-and-sqlite-query: ok');
          NODE
          node -p "JSON.stringify({node:process.version,modules:process.versions.modules,platform:process.platform,arch:process.arch})"
          npm ls --depth=0

      - name: Package full isolated node_modules
        shell: bash
        run: |
          set -euo pipefail
          tar -C test-env -czf bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env.tar.gz node_modules package.json package-lock.json
          sha256sum bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env.tar.gz > bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env.tar.gz.sha256

      - name: Upload full test environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env
          path: |
            bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env.tar.gz
            bluebot-v2.0.170-node22.16.0-linux-x64-full-test-env.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
